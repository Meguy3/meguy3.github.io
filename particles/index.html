<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clusters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h3>Simulation Controls</h3>
    <label>Species count
      <input id="speciesCount" type="number" min="1" max="25" value="4">
    </label>
    <label>Particle count
      <input id="particleCount" type="number" min="0" max="3000" value="1200">
    </label>
    <label>Radius max
      <input id="rMax" type="range" min="20" max="200" value="90">
    </label>
    <label>Time step
      <input id="dt" type="range" min="0.3" max="3" step="0.1" value="1.0">
    </label>
    <label>Damping
      <input id="damp" type="range" min="0" max="0.25" step="0.005" value="0.02">
    </label>
    <button id="randomize">Randomize matrix</button>
    <button id="reset">Reset particles</button>
    <button id="clear">Zero matrix</button>
    <button id="freeze">Freeze / Resume</button>
    <button id="zap">Zap!</button>
    <button id="toggleMode">Wall Mode</button>
    <label>Particle size
    <input id="particleSize" type="range" min="2" max="10" value="4">
    </label>
    <label>Trail
    <input id="trail" type="range" min="0.1" max="1" step="0.05" value="0.3">
    </label>

    <h3 id="mlabel">Attraction Matrix</h3>
    <div id="matrix"></div>
    <h3 id="glabel">Graph Editor</h3>
    <button id="exitMatrix" style="display:none">Exit Graph</button>
    <canvas id="graph" width="300" height="180"></canvas>
    <button id="save">Save</button>
    <input id="loadFile" type="file" accept=".json" style="display:none">
    <button id="load">Load</button>
    <button id="loadExample" type="file" accept=".json" style="display:none">Load Example</button>

  </div>

  <script src="sim.js"></script>
  <script src="ui.js"></script>
</body>
</html>
